<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  * {
    margin: 0;
    padding: 0;
    outline: none;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 10px;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(115deg, #56d8e4 10%, #9f01ea 90%);
  }

  .container {
    max-width: 800px;
    background: #fff;
    width: 100%;
    padding: 25px 40px 10px 40px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
  }

  .container .text {
    text-align: center;
    font-size: 41px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    background: -webkit-linear-gradient(right, #56d8e4, #9f01ea, #56d8e4, #9f01ea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .container form {
    padding: 30px 0 0 0;
  }

  .container form .form-row {
    display: flex;
    margin: 32px 0;
  }

  form .form-row .input-data {
    width: 100%;
    height: 40px;
    margin: 0 20px;
    position: relative;
  }

  form .form-row .textarea {
    height: 70px;
  }

  .form-popup {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-popup .error {
    font-size: 18px;
    color: #b10c00;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    background: #fdecea;
    border-radius: 6px;
  }

  .match {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 14px;
    background: #f7f8fc;
    border-radius: 8px;
    border-left: 4px solid #9f01ea;
  }

  .match-lone {
    border-left-color: #56d8e4;
    justify-content: flex-start;
  }

  .team {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }

  .team-3 {
    border-left-color: #3498db;
  }

  .player {
    display: inline-block;
    min-width: 32px;
    padding: 4px 10px;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    text-align: center;
  }

  .vs {
    font-size: 13px;
    font-weight: 700;
    color: #9f01ea;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .input-data input,
  .textarea textarea {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    font-size: 17px;
    border-bottom: 2px solid rgba(0, 0, 0, 0.12);
  }

  .input-data input:focus~label,
  .textarea textarea:focus~label,
  .input-data input:valid~label,
  .textarea textarea:valid~label {
    transform: translateY(-20px);
    font-size: 14px;
    color: #3498db;
  }

  .textarea textarea {
    resize: none;
    padding-top: 10px;
  }

  .input-data label {
    position: absolute;
    pointer-events: none;
    bottom: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .textarea label {
    width: 100%;
    bottom: 40px;
    background: #fff;
  }

  .input-data .underline {
    position: absolute;
    bottom: 0;
    height: 2px;
    width: 100%;
  }

  .input-data .underline:before {
    position: absolute;
    content: "";
    height: 2px;
    width: 100%;
    background: #3498db;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.3s ease;
  }

  .input-data input:focus~.underline:before,
  .input-data input:valid~.underline:before,
  .textarea textarea:focus~.underline:before,
  .textarea textarea:valid~.underline:before {
    transform: scale(1);
  }

  .submit-btn {
    justify-content: center;
  }

  .btn-primary {
    width: 100%;
    max-width: 320px;
    height: 45px;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    background-image: linear-gradient(115deg, #56d8e4, #9f01ea, #56d8e4, #9f01ea);
    background-size: 300% 100%;
    background-position: 100% 0;
    transition: background-position 0.4s ease, transform 0.1s ease, box-shadow 0.2s ease;
  }

  .btn-primary:hover {
    background-position: 0 0;
    box-shadow: 0 4px 12px rgba(159, 1, 234, 0.25);
  }

  .btn-primary:active {
    transform: translateY(1px);
  }

  @media (max-width: 700px) {
    .container {
      padding: 20px 18px 10px 18px;
    }

    .container .text {
      font-size: 30px;
    }

    .container form {
      padding: 10px 0 0 0;
    }

    .container form .form-row {
      display: block;
      margin: 20px 0;
    }

    form .form-row .input-data {
      margin: 35px 0 !important;
    }

    .btn-primary {
      display: block;
      margin: 0 auto;
    }

    .match {
      padding: 10px;
      gap: 8px;
    }

    .player {
      font-size: 14px;
      min-width: 28px;
      padding: 3px 8px;
    }
  }
</style>    <title>Définir des équipes de joueurs</title>
    <script>
        // Retourne un entier aléatoire uniforme dans [0, maxExclusive[.
        // Utilise crypto.getRandomValues (CSPRNG) avec rejection sampling pour
        // éviter le biais de modulo, avec repli sur Math.random si indisponible.
        function secureRandomInt(maxExclusive) {
            const cryptoObj = window.crypto;
            if (cryptoObj && cryptoObj.getRandomValues) {
                const total = 4294967296; // 2^32 valeurs possibles sur un Uint32
                const limit = total - (total % maxExclusive);
                const buf = new Uint32Array(1);
                let value;
                do {
                    cryptoObj.getRandomValues(buf);
                    value = buf[0];
                } while (value >= limit);
                return value % maxExclusive;
            }
            return Math.floor(Math.random() * maxExclusive);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Répartit les joueurs en doublettes et triplettes uniquement.
        // Avec k équipes: triplettes = nbJoueurs - 2k et doublettes = 3k - nbJoueurs,
        // valable pour ceil(nbJoueurs / 3) <= k <= floor(nbJoueurs / 2).
        // On prend le plus grand k PAIR de cet intervalle:
        //  - pair => toutes les équipes sont appariées, personne ne reste sur le banc,
        //  - le plus grand => un maximum de doublettes, le format de base de la mêlée.
        // Ex. 11 joueurs: k = 4 => 3 triplettes + 1 doublette (3v3 et 3v2).
        // Si aucun k pair n'existe (2, 3 et 7 joueurs), on garde le plus grand k
        // et une équipe attend le tour suivant.
        function teamCompute(nbJoueurs) {
            const kMin = Math.ceil(nbJoueurs / 3);
            const kMax = Math.floor(nbJoueurs / 2);

            let nbEquipes = kMax;
            for (let k = kMax; k >= kMin; k--) {
                if (k % 2 === 0) {
                    nbEquipes = k;
                    break;
                }
            }

            return {
                triplettes: nbJoueurs - 2 * nbEquipes,
                doublettes: 3 * nbEquipes - nbJoueurs
            };
        }

        function populate(nbJoueurs) {
            const { triplettes, doublettes } = teamCompute(nbJoueurs);
            const listPlayers = shuffle(Array.from({ length: nbJoueurs }, (_, i) => i + 1));
            const teams = [];

            for (let i = 0; i < triplettes; i++) teams.push(listPlayers.splice(0, 3));
            for (let i = 0; i < doublettes; i++) teams.push(listPlayers.splice(0, 2));
            return teams;
        }

        function definirEquipes() {
            const resultat = document.getElementById('resultat');
            resultat.innerHTML = '';
            const nbJoueurs = parseInt(document.getElementById('nbJoueurs').value, 10);

            if (!Number.isFinite(nbJoueurs) || nbJoueurs < 2) {
                const err = document.createElement('p');
                err.className = 'error';
                err.textContent = 'Saisir au moins 2 joueurs.';
                resultat.appendChild(err);
                return;
            }

            const equipes = populate(nbJoueurs);
            const doublettes = equipes.filter(e => e.length === 2);
            const autres = equipes.filter(e => e.length !== 2);
            renderMatchups(resultat, doublettes, autres);
        }

        function renderMatchups(container, doublettes, autres) {
            const doublettePairs = Math.floor(doublettes.length / 2);
            for (let i = 0; i < doublettePairs; i++) {
                container.appendChild(makeMatch(doublettes[2 * i], doublettes[2 * i + 1]));
            }
            const autresPairs = Math.floor(autres.length / 2);
            for (let i = 0; i < autresPairs; i++) {
                container.appendChild(makeMatch(autres[2 * i], autres[2 * i + 1]));
            }
            const loneDoublette = doublettes.length % 2 === 1 ? doublettes[doublettes.length - 1] : null;
            const loneAutre = autres.length % 2 === 1 ? autres[autres.length - 1] : null;
            if (loneDoublette && loneAutre) {
                // Match déséquilibré (3 contre 2): la plus grosse équipe d'abord.
                container.appendChild(makeMatch(loneAutre, loneDoublette));
            } else if (loneDoublette) {
                container.appendChild(makeMatch(loneDoublette, null));
            } else if (loneAutre) {
                container.appendChild(makeMatch(loneAutre, null));
            }
        }

        function makeMatch(teamA, teamB) {
            const match = document.createElement('div');
            match.className = 'match';
            match.appendChild(makeTeam(teamA));
            if (teamB) {
                const vs = document.createElement('span');
                vs.className = 'vs';
                vs.textContent = 'VS';
                match.appendChild(vs);
                match.appendChild(makeTeam(teamB));
            } else {
                match.classList.add('match-lone');
            }
            return match;
        }

        function makeTeam(players) {
            const team = document.createElement('div');
            team.className = `team team-${players.length}`;
            for (const p of players) {
                const chip = document.createElement('span');
                chip.className = 'player';
                chip.textContent = p;
                team.appendChild(chip);
            }
            return team;
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="text">
            Tirage pour la pétanque
        </div>
        <form onsubmit="definirEquipes(); return false;">
            <div class="form-row">
                <div class="input-data">
                    <input type="number" id="nbJoueurs" min="2" required>
                    <div class="underline"></div>
                    <label for="nbJoueurs">Nombre de joueurs initial:</label>
                </div>
            </div>
            <div class="form-row submit-btn">
                <button type="submit" class="btn-primary">Définir les équipes</button>
            </div>
            <div class="form-popup" id="resultat"></div>
        </form>
    </div>
</body>

</html>
