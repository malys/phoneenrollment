name: offline

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Nécessaire au déploiement GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xonsh
        run: pip install xonsh

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Build standalone page
        run: mise run offline

      # dist/ devient la racine du site: dist/index.html = page d'accueil.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
