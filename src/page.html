<!DOCTYPE html>

<html>

<head>
   <base target="_top">
   <?!= HtmlService.createHtmlOutputFromFile('stylesheet.html').getContent(); ?>
</head>
<div class="container">
   <div class="text">
      Groupe de pétanque

   </div>
   <form action="#">
      <p>Si vous voulez être informé quand aura lieu la prochaine partie.</p>
      <p>Merci de remplir le formualaire.</p>
      <div class="form-row">
         <div class="input-data">
            <input type="tel" id="phoneInput" pattern="^\+33[0-9]{9}" required>
            <div class="underline"></div>
            <label for="">Télèphone mobile</label><i>ex: +33607060706</i>
         </div>
         <div class="input-data">
            <input type="text" id="firstNameInput" pattern="^[a-zA-Z]{5,}$" required>
            <div class="underline"></div>
            <label for="">Prénom</label> <i>ex: Sylvain</i>
         </div>
      </div>
      <div class="form-row">
         <div class="input-data">
            <input type="text" id="lastNameInput" pattern="^[a-zA-Z]{5,}$" required>
            <div class="underline"></div>
            <label for="">Nom</label> <i>ex: Dupiont</i>
         </div>
         <div class="input-data">
            <input type="text" id="codeInput" autocomplete="street-address" required>
            <div class="underline"></div>
            <label for="">Code sécurité</label><i>Nom du village du terrain</i>
         </div>
      </div>
      <div class="form-row">
         <div class="input-data">
            <div class="form-row submit-btn">
               <div class="input-data">
                  <div class="inner"></div>
                  <input id="submitButton" type="submit" value="Inscription">
               </div>
               <div class="input-data">
                  <div class="inner"></div>
                  <input id="removeButton" type="submit" value="Désinscription">
               </div>
            </div>
            <div class="form-popup" id="okForm" style="display:none">
               <p>Votre demande a bien été prise en compte.</p>
            </div>
            <div class="form-popup" id="koForm" style="display:none">
               <p>Le formulaire est invalide.</p>
            </div>
   </form>
</div>

<!-- The form -->

<script>
   const FIELDS = [
      {
         id: "phoneInput",
         message: ['Saisir un numéro de télèphone!', 'Saisir un numéro de télèphone: +33607060706']
      },
      {
         id: "firstNameInput",
         message: ['Saisir un prénom', 'lettres uniquement et taille > 5']
      },
      {
         id: "lastNameInput",
         message: ['Saisir un nom', 'lettres uniquement et taille > 5']
      },
   ]

   function clean() {
      // Clear the `phoneInput` text box.
      document.getElementById('phoneInput').value = '';
      document.getElementById('firstNameInput').value = '';
      document.getElementById('lastNameInput').value = '';
      document.getElementById('codeInput').value = '';
      document.getElementById("okForm").style.display = "block";
      document.getElementById("koForm").style.display = "none";
   }
   function validity() {

      FIELDS.forEach(p => {
         const input = document.getElementById(p.id);

         input.addEventListener('input', () => {
            input.setCustomValidity('');
            input.checkValidity();
         });

         input.addEventListener('invalid', () => {
            if (input.value === '') {
               input.setCustomValidity(p.message[0]);
            } else {
               input.setCustomValidity(p.message[1]);
            }
         });
      })
   }

   validity()

   document.getElementById('submitButton').addEventListener('click', function () {
      if (FIELDS.map(m => document.getElementById(m.id).checkValidity()).every(e => e == true)) {
         // Get the value from the `phoneInput` text box.
         var phoneNumber = document.getElementById('phoneInput').value;
         var firstName = document.getElementById('firstNameInput').value;
         var lastName = document.getElementById('lastNameInput').value;
         var code = document.getElementById('codeInput').value;
         // Run the Apps Script `userClicked` function passing the `phoneNumber` input.
         if (phoneNumber && phoneNumber.toString().startsWith('+33') && code) {
            google.script.run.withFailureHandler(() => console.log("Something went wrong")).userClicked(phoneNumber.trim(), firstName.trim(), lastName.trim(), code.trim());
            clean();
         } else {
            document.getElementById("koForm").style.display = "block";
         }
      }

   });

   document.getElementById('removeButton').addEventListener('click', function () {

      if (FIELDS.map(m => document.getElementById(m.id).checkValidity()).every(e => e == true)) {
         // Get the value from the `phoneInput` text box.
         // Get the value from the `phoneInput` text box.
         var phoneNumber = document.getElementById('phoneInput').value;
         var code = document.getElementById('codeInput').value
         // Run the Apps Script `userClicked` function passing the `phoneNumber` input.
         if (phoneNumber && code) {
            google.script.run.userRemoved(phoneNumber.trim(), code.trim());
            clean();
         } else {
            document.getElementById("koForm").style.display = "block";
         }
      }
   });
</script>

</html>
