<style>
  @import url('https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap');

  * {
    margin: 0;
    padding: 0;
    outline: none;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 10px;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(115deg, #56d8e4 10%, #9f01ea 90%);
  }

  .container {
    max-width: 800px;
    background: #fff;
    width: 100%;
    padding: 25px 40px 10px 40px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
  }

  .container .text {
    text-align: center;
    font-size: 41px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    background: -webkit-linear-gradient(right, #56d8e4, #9f01ea, #56d8e4, #9f01ea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .container form {
    padding: 30px 0 0 0;
  }

  .container form .form-row {
    display: flex;
    margin: 32px 0;
  }

  form .form-row .input-data {
    width: 100%;
    height: 40px;
    margin: 0 20px;
    position: relative;
  }

  form .form-row .textarea {
    height: 70px;
  }

  .form-popup {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .form-popup .error {
    font-size: 18px;
    color: #b10c00;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    background: #fdecea;
    border-radius: 6px;
  }

  .match {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 14px;
    background: #f7f8fc;
    border-radius: 8px;
    border-left: 4px solid #9f01ea;
  }

  .match-lone {
    border-left-color: #56d8e4;
    justify-content: flex-start;
  }

  .team {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }

  .team-3 {
    border-left-color: #3498db;
  }

  .player {
    display: inline-block;
    min-width: 32px;
    padding: 4px 10px;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    text-align: center;
  }

  .vs {
    font-size: 13px;
    font-weight: 700;
    color: #9f01ea;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .input-data input,
  .textarea textarea {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    font-size: 17px;
    border-bottom: 2px solid rgba(0, 0, 0, 0.12);
  }

  .input-data input:focus~label,
  .textarea textarea:focus~label,
  .input-data input:valid~label,
  .textarea textarea:valid~label {
    transform: translateY(-20px);
    font-size: 14px;
    color: #3498db;
  }

  .textarea textarea {
    resize: none;
    padding-top: 10px;
  }

  .input-data label {
    position: absolute;
    pointer-events: none;
    bottom: 10px;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .textarea label {
    width: 100%;
    bottom: 40px;
    background: #fff;
  }

  .input-data .underline {
    position: absolute;
    bottom: 0;
    height: 2px;
    width: 100%;
  }

  .input-data .underline:before {
    position: absolute;
    content: "";
    height: 2px;
    width: 100%;
    background: #3498db;
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.3s ease;
  }

  .input-data input:focus~.underline:before,
  .input-data input:valid~.underline:before,
  .textarea textarea:focus~.underline:before,
  .textarea textarea:valid~.underline:before {
    transform: scale(1);
  }

  .submit-btn {
    justify-content: center;
  }

  .btn-primary {
    width: 100%;
    max-width: 320px;
    height: 45px;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 17px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    background-image: linear-gradient(115deg, #56d8e4, #9f01ea, #56d8e4, #9f01ea);
    background-size: 300% 100%;
    background-position: 100% 0;
    transition: background-position 0.4s ease, transform 0.1s ease, box-shadow 0.2s ease;
  }

  .btn-primary:hover {
    background-position: 0 0;
    box-shadow: 0 4px 12px rgba(159, 1, 234, 0.25);
  }

  .btn-primary:active {
    transform: translateY(1px);
  }

  @media (max-width: 700px) {
    .container {
      padding: 20px 18px 10px 18px;
    }

    .container .text {
      font-size: 30px;
    }

    .container form {
      padding: 10px 0 0 0;
    }

    .container form .form-row {
      display: block;
      margin: 20px 0;
    }

    form .form-row .input-data {
      margin: 35px 0 !important;
    }

    .btn-primary {
      display: block;
      margin: 0 auto;
    }

    .match {
      padding: 10px;
      gap: 8px;
    }

    .player {
      font-size: 14px;
      min-width: 28px;
      padding: 3px 8px;
    }
  }
</style>
