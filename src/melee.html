<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="stylesheet.html">

    <title>Définir des équipes de joueurs</title>
    <script>
        function teamCompute(nbJoueurs, teamList) {
            let restDoublette = nbJoueurs % 4;
            let restTriplette = nbJoueurs % 6;
            if (restDoublette === 0 || (restDoublette !== 0 && (restDoublette === 1 || restDoublette === 3))) {
                teamList.push({ size: 2, nb: Math.floor(nbJoueurs / 4) * 2 });
                if (restDoublette <= 3) teamList.push({ size: restDoublette, nb: 1 })
            } else if (restTriplette === 0 || restTriplette > 2) {
                teamList.push({ size: 3, nb: Math.floor(nbJoueurs / 6) * 2 });
                if (restTriplette === 3) {
                    teamList.push({ size: 3, nb: 1 });
                }
            } else if (restDoublette === restTriplette) {
                teamList = teamCompute(Math.floor(nbJoueurs / 2), teamList);
                teamList = teamCompute(nbJoueurs - Math.floor(nbJoueurs / 2), teamList);
            }
            const notAttributed = nbJoueurs - teamList.reduce((a, b) => a + b.size * b.nb, 0);
            if (notAttributed > 0) {
                teamList = teamCompute(notAttributed, teamList);
            }
            return teamList
        }
        function populate(nbJoueurs, equipes) {
            // Récupérer le nombre de joueurs initial
            let teamList = teamCompute(nbJoueurs, []);
            //console.log(teamList)
            let listPlayers = Array.from({ length: nbJoueurs }, (_, i) => i + 1).sort(s => Math.random() - 0.5);

            for (let index = 0; index < teamList.length; index++) {
                const t = teamList[index];
                for (let j = 0; j < t.nb; j++) {
                    equipes.push(listPlayers.splice(0, t.size));
                }

            }

            return equipes.filter(f => f.length > 0).sort((a, b) => b.length - a.length);
        }

        function definirEquipes() {
            // Récupérer le nombre de joueurs initial
            const result = populate(parseInt(document.getElementById('nbJoueurs').value, 10), []);

            // Afficher les équipes dans la page
            const resultat = document.getElementById('resultat');
            resultat.innerHTML = '';
            display(result.filter(f => f.length === 2));
            display(result.filter(f => f.length !== 2));
        }
        function display(equipes) {
            for (let i = 0; i < Math.floor(equipes.length / 2); i++) {
                const equipe = document.createElement('p');
                equipe.textContent = `${equipes[2 * i].join(', ')}  >  ${equipes[2 * i + 1].join(', ')}`;
                resultat.appendChild(equipe);
            }
            if (equipes.length % 2 == 1) {
                const equipe = document.createElement('p');
                equipe.textContent = `${equipes[equipes.length - 1].join(', ')}`;
                resultat.appendChild(equipe);
            }
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="text">
            Tirage pour la pétanque
        </div>
        <form action="#">
            <div class="form-row">
                <div class="input-data">
                    <input type="number" id="nbJoueurs" min="0" required>
                    <div class="underline"></div>
                    <label for="nbJoueurs">Nombre de joueurs initial:</label>
                </div>
            </div>
            <div class="form-row submit-btn">
                <button onclick="definirEquipes()">Définir les équipes</button>
            </div>
            <div class="form-popup" id="resultat"></div>
        </form>
    </div>
</body>

</html>
